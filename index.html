<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Repentina · Apple Developer Academy</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17372d;background:#f4f6ef;font-synthesis:none;--gap:20px}
*{box-sizing:border-box}body{margin:0}
header,main,footer{width:calc(100% - 64px);max-width:1164px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 0;border-bottom:1px solid #d5ddd0}
.brand{font-size:clamp(17px,2vw,23px);line-height:1.3;font-weight:750;letter-spacing:-.025em}
.brand span{display:block;font-size:12px;font-weight:500;letter-spacing:.12em;color:#52665a;margin-top:7px}
.event-name{font-size:clamp(25px,3vw,34px);font-weight:750;letter-spacing:-.045em;text-align:right}
main{padding-block:44px 28px}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--gap);align-items:center;margin-bottom:32px}
.eyebrow{grid-column:1/3;text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:700;color:#5a705f;margin-bottom:14px}
h1{grid-column:1/3;grid-row:2;font-size:clamp(32px,4.5vw,56px);letter-spacing:-.045em;line-height:1.1;margin:0}
.badge{grid-column:3;grid-row:2;justify-self:end;align-self:center;background:#ddecba;color:#17372d;padding:14px 22px;border:1px solid #d0e2a6;border-radius:14px;font-size:clamp(22px,2.6vw,30px);line-height:1.2;font-weight:700;letter-spacing:-.035em;white-space:nowrap}
p.intro{grid-column:1/3;color:#5a6c60;font-size:16px;line-height:1.6;margin:18px 0 0;max-width:620px}
.search{width:calc((100% - var(--gap)/2)*2/3)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}
input{width:100%;padding:16px 18px;border:1px solid #bac9b2;border-radius:12px;background:#fff;font:inherit;color:inherit}
input:focus{outline:3px solid #bbd49c;outline-offset:2px}
.toolbar{display:flex;align-items:center;justify-content:space-between;min-height:36px;margin:24px 0 14px;gap:16px;color:#5a6c60;font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid #b6c7aa;background:transparent;border-radius:8px;padding:8px 12px;color:#17372d}
#teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-items:start}
.team{background:#fff;border:1px solid #dbe2d5;border-radius:16px;padding:22px;min-width:0}
.team h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:20px;letter-spacing:-.03em;margin:0 0 22px}
.team h2 span{color:#687d61;font-size:12px;font-weight:400;letter-spacing:0;white-space:nowrap}
.group+.group{border-top:1px solid #edf0e9;margin-top:18px;padding-top:18px}
.group h3{text-transform:uppercase;font-size:10px;letter-spacing:.12em;margin:0 0 12px;color:#58704c}
.group.out h3{color:#97612d}.group.stay h3{color:#52665a}
.person{margin:12px 0}.person:last-child{margin-bottom:0}
.person strong{display:block;font-size:14px;font-weight:550;line-height:1.5;overflow-wrap:anywhere}
.person small{display:block;font-size:12px;color:#6a7c63;margin-top:4px}
.person.match{background:#edf6d9;border-radius:6px;padding:8px}
.empty{font-size:13px;color:#74816e}.notice{background:#e7eddd;border-radius:12px;padding:18px;line-height:1.6;margin:18px 0}
footer{font-size:12px;color:#75826f;padding-bottom:36px}
.suggestions{margin:8px 0 0;padding:6px;list-style:none;background:#fff;color:#17372d;border:1px solid #bac9b2;border-radius:12px;max-height:260px;overflow-y:auto;box-shadow:0 8px 24px #17372d12}
.suggestions li{padding:12px;border-radius:7px;cursor:pointer;line-height:1.4;overflow-wrap:anywhere}
.suggestions li:hover,.suggestions li[aria-selected="true"]{background:#e7eddd;color:#17372d}
[hidden]{display:none!important}
@media(max-width:900px){#teams{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr) auto}.eyebrow,h1,p.intro{grid-column:1}.badge{grid-column:2}.search{width:100%}}
@media(max-width:580px){:root{--gap:16px}header,main,footer{width:calc(100% - 40px)}header{gap:16px;padding:22px 0}.brand{font-size:16px}.brand span{font-size:11px}.event-name{font-size:25px}main{padding-top:30px}.hero{column-gap:12px;margin-bottom:26px}.eyebrow{grid-column:1/-1;font-size:9px;letter-spacing:.12em}h1{font-size:32px}.badge{font-size:18px;padding:11px 13px;border-radius:11px}p.intro{grid-column:1/-1;font-size:14px;margin-top:16px}#teams{grid-template-columns:1fr}.toolbar{align-items:center;font-size:12px}.team{padding:20px}}
</style>
<header><div class="brand">Apple Developer Academy<span>PUCPR</span></div><div class="event-name">Repentina</div></header>
<main>
<section class="hero" aria-labelledby="title">
<div class="eyebrow" id="eyebrow">Repentina · Equipes</div>
<h1 id="title">Encontre sua equipe</h1>
<div class="badge" id="round" hidden></div>
<p class="intro" id="intro">Busque seu nome para encontrar sua equipe.</p>
</section>
<div class="search" id="search-area"><label for="search">Qual é o seu nome?</label><input id="search" type="search" role="combobox" aria-autocomplete="list" aria-controls="names" aria-expanded="false" placeholder="Comece a digitar seu nome…" autocomplete="off"><ul id="names" class="suggestions" role="listbox" aria-label="Nomes encontrados" hidden></ul></div>
<div id="personal" class="notice" role="status" hidden></div>
<div class="toolbar" id="toolbar"><span id="count" role="status" aria-live="polite"></span><button id="clear" hidden>Mostrar todos os times</button></div>
<div id="teams"></div>
<p id="empty" class="notice" hidden>Nenhum nome encontrado. Confira a escrita ou tente apenas uma parte do nome.</p>
</main>
<footer>Repentina · Apple Developer Academy PUCPR</footer>
<script>
'use strict';
let data=/*__ROUND_DATA__*/null;
const $=id=>document.getElementById(id);
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim();
function element(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el}
function render(){
 $('search-area').hidden=!data;$('toolbar').hidden=!data;
 if(!data){$('teams').replaceChildren();$('names').replaceChildren();$('personal').hidden=true;$('personal').textContent='';$('search').value='';$('count').textContent='';$('empty').hidden=true;$('round').hidden=true;$('round').textContent='';$('title').textContent='Página indisponível no momento.';$('intro').textContent='Aguarde as orientações da organização.';$('eyebrow').textContent='Repentina';closeSuggestions();suggestions=[];return}
 $('round').hidden=data.round===0;$('round').textContent=data.round===0?'':`${data.round}ª Troca`;
 $('eyebrow').textContent=data.round===0?'Repentina · Equipes':'Encontre seu próximo time';
 $('title').textContent=data.round===0?'Encontre sua equipe':'É hora de trocar.';
 $('intro').textContent=data.round===0?'Busque seu nome para encontrar sua equipe.':'Veja quem sai e quem chega em cada time. Busque seu nome para encontrar seu destino nesta troca.';
 const query=normalize($('search').value);
 const matches=data.participants.filter(p=>normalize(p.name).includes(query));
 const matching=new Set(matches.map(p=>p.id));
 const visible=query?data.teams.filter(t=>matches.some(p=>p.from===t||p.to===t)):data.teams;
 $('teams').replaceChildren();$('clear').hidden=!query;$('empty').hidden=visible.length>0;
 $('count').textContent=query?`${matches.length} pessoa(s) · ${visible.length} time(s)`:`${data.teams.length} times · ${data.participants.length} participantes`;
 $('personal').hidden=!query||matches.length!==1;
 if(query&&matches.length===1){const p=matches[0];$('personal').textContent=data.round===0?`${p.name}, sua equipe é a ${p.to}.`:p.from===p.to?`${p.name}, você permanece no time ${p.to}.`:`${p.name}, saia do time ${p.from} e vá para o time ${p.to}.`}
 for(const t of visible){
  const card=element('section',undefined,'team'), heading=element('h2',`Time ${String(t).padStart(2,'0')}`);
  const incoming=data.participants.filter(p=>p.to===t&&p.from!==t),outgoing=data.participants.filter(p=>p.from===t&&p.to!==t);
  heading.append(element('span',data.round===0?'Integrantes':`${incoming.length} entra · ${outgoing.length} sai`));card.append(heading);
  const groups=data.round===0?[['Equipe',data.participants.filter(p=>p.to===t),'initial']]:[['↗ Quem sai',outgoing,'out'],['↘ Quem entra',incoming,'in'],['Quem fica',data.participants.filter(p=>p.from===t&&p.to===t),'stay']];
  for(const [title,people,kind] of groups){const group=element('div',undefined,`group ${kind}`);group.append(element('h3',title));
   if(!people.length)group.append(element('p',kind==='stay'?'Ninguém permanece neste time.':'Sem movimentações.','empty'));
   for(const p of people){const row=element('div',undefined,`person${query&&matching.has(p.id)?' match':''}`);row.append(element('strong',p.name));if(kind==='out'||kind==='in')row.append(element('small',kind==='out'?`Vai para o time ${p.to}`:`Vem do time ${p.from}`));group.append(row)}card.append(group)
  }$('teams').append(card)
 }
}
let suggestions=[],activeSuggestion=-1;
function closeSuggestions(){
 $('names').hidden=true;$('search').setAttribute('aria-expanded','false');
 $('search').removeAttribute('aria-activedescendant');activeSuggestion=-1;
}
function showSuggestions(){
 const query=normalize($('search').value);
 suggestions=query&&data?data.participants.filter(p=>normalize(p.name).includes(query)):[];
 $('names').replaceChildren();activeSuggestion=-1;$('search').removeAttribute('aria-activedescendant');
 for(const [index,p] of suggestions.entries()){
  const option=element('li',p.name.trim());option.id=`suggestion-${index}`;
  option.setAttribute('role','option');option.setAttribute('aria-selected','false');
  option.addEventListener('mousedown',event=>event.preventDefault());
  option.addEventListener('click',()=>selectSuggestion(index));$('names').append(option);
 }
 $('names').hidden=!suggestions.length;$('search').setAttribute('aria-expanded',String(!!suggestions.length));
}
function selectSuggestion(index){
 $('search').value=suggestions[index].name.trim();closeSuggestions();render();$('search').focus();
 // Focus can reopen the list after a pointer selection.
 closeSuggestions();
}
$('search').addEventListener('input',()=>{render();showSuggestions()});
$('search').addEventListener('focus',showSuggestions);
$('search').addEventListener('blur',closeSuggestions);
$('search').addEventListener('keydown',event=>{
 if(event.key==='Escape'){event.preventDefault();closeSuggestions();return}
 if(event.key==='Tab'){closeSuggestions();return}
 if(event.key==='Enter'&&!$('names').hidden&&activeSuggestion>=0){event.preventDefault();selectSuggestion(activeSuggestion);return}
 if(event.key!=='ArrowDown'&&event.key!=='ArrowUp')return;
 if($('names').hidden)showSuggestions();if(!suggestions.length)return;
 event.preventDefault();
 activeSuggestion=activeSuggestion<0?(event.key==='ArrowDown'?0:suggestions.length-1):(activeSuggestion+(event.key==='ArrowDown'?1:-1)+suggestions.length)%suggestions.length;
 for(const [index,option] of Array.from($('names').children).entries())option.setAttribute('aria-selected',String(index===activeSuggestion));
 const selected=$('names').children[activeSuggestion];$('search').setAttribute('aria-activedescendant',selected.id);selected.scrollIntoView({block:'nearest'});
});
$('clear').addEventListener('click',()=>{$('search').value='';render();$('search').focus();closeSuggestions()});render();
// Published pages contain no participant data in their HTML. Local previews
// can still embed a single round and do not use the online polling endpoint.
if(data===null){
 let pending=false;
 async function refreshState(){
  if(pending)return;pending=true;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),8000);
  try{
   const response=await fetch(`current.json?fresh=${Date.now()}`,{cache:'no-store',signal:controller.signal});
   if(!response.ok)throw new Error('State unavailable');
   const next=await response.json();
   if(next.closed===true){data=null}else{
    if(!Number.isInteger(next.round)||next.round<0||next.round>4||!Array.isArray(next.participants)||next.participants.length!==120||!Array.isArray(next.teams)||next.teams.length!==30)throw new Error('Invalid state');
    data=next;
   }
  }catch{data=null}
  finally{clearTimeout(timeout);pending=false;closeSuggestions();render()}
 }
 refreshState();setInterval(refreshState,15000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){data=null;render();refreshState()}});
}
</script>
</html>
